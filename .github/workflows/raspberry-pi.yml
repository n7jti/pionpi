name: Raspberry Pi

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  raspberry-pi:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, Linux, ARM64, raspberry-pi, pionpi]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Standard PI vector tests
        run: ctest --test-dir build -C Release --output-on-failure -LE extended
      - name: Million-digit PI vector test
        run: ctest --test-dir build -C Release --output-on-failure -L extended
